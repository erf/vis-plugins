<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>vis-plugins</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<h1>vis-plugins</h1>

	<p>A collection of plugins and themes for the <a href="https://github.com/martanne/vis">vis</a> text editor.</p>
	<p>You are welcome to contribute via <a href="https://github.com/erf/vis-plugins">vis-plugins</a>.</p>
	<p>Plugins can be installed <a href="https://github.com/martanne/vis/wiki/Plugins">manually</a> or using <a
			href="https://github.com/erf/vis-plug">vis-plug</a>.</p>
	<blockquote>Originally based on the <a href="https://github.com/martanne/vis/wiki">vis wiki</a>.</blockquote>

	<nav>
		<button id="show-plugins" onclick="set_plugin_type('plugin')">Plugins</button>
		<button id="show-themes" onclick="set_plugin_type('theme')">Themes</button>
		<span id="count"></span>
		<button id="theme-toggle" aria-label="Toggle dark mode"></button>
	</nav>

	<input type="search" id="search" placeholder="Search ( / )" aria-label="Search" autocomplete="off" autofocus>

	<main>
		<ul id="plugins" class="container"></ul>
		<p id="empty" hidden>No results.</p>
	</main>

	<script type="text/javascript" src="plugins.js"></script>
	<script type="text/javascript" src="themes.js"></script>
	<script type="text/javascript" src="elite.min.js"></script>
	<script type="text/javascript" src="script.js"></script>
</body>

</html>
